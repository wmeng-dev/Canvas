# ⚠️ 这是 CI 工作流的**模板文件**，放在 docs/ci/ 而非 .github/workflows/ 是有原因的：
#    本机推送用的 Personal Access Token 没有 workflow 权限，GitHub 会直接拒绝
#    （refusing to allow a Personal Access Token to create or update workflow ... without `workflow` scope）。
#    启用方式二选一：
#      ① GitHub 网页：Actions → New workflow → "set up a workflow yourself" → 粘贴本文件内容，
#         路径填 .github/workflows/build.yml（最省事，不需要动 token）
#      ② 给 PAT 加上 workflow scope 后，把本文件移到 .github/workflows/build.yml 再 push
#
# 跨平台打包：Windows 安装包（本机/CI 均可）+ macOS 安装包（**必须在 macOS 上构建**）。
#
# 触发：
#   · push 标签 v*（发版）
#   · 或手动 workflow_dispatch（可在 Actions 页面点 Run workflow）
# 产物：Actions 运行页底部的 Artifacts
#   · IdeaSprout-win-installer   → .exe 安装包（nsis）
#   · IdeaSprout-mac-dmg         → .dmg（x64 / arm64）
#   · IdeaSprout-mac-zip         → .zip 免安装版（x64 / arm64）
#
# 关于签名（未签名也能出包，只是 macOS 会提示"无法验证开发者"，需右键 → 打开）：
#   · macOS 签名：在仓库 Secrets 里配 MAC_CERTIFICATE（base64 的 .p12）、MAC_CERTIFICATE_PASSWORD、
#     CSC_KEYCHAIN_PASSWORD，并把下面 mac 任务的 CSC_IDENTITY_AUTO_DISCOVERY 改成 true。
#   · Windows 签名：配 WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD（可选，不配就出未签名的 exe）。

name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build:main
      - run: npm run build:renderer
      - name: 打包 Windows 安装包
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: IdeaSprout-win-installer
          path: release/*.exe

  macos:
    runs-on: macos-latest
    env:
      # 没配证书时明确关掉自动发现，避免构建卡在找签名身份
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build:main
      - run: npm run build:renderer
      - name: 打包 macOS（dmg + zip，x64 与 arm64）
        run: npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: IdeaSprout-mac-dmg
          path: release/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: IdeaSprout-mac-zip
          path: release/*.zip
