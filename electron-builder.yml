# D.2 Windows 打包配置（electron-builder）
#
# 关键点：
# - directories.output 必须避开 dist/ —— 渲染层的 vite 产物就输出在 dist/renderer，
#   而 electron-builder 默认输出目录也叫 dist，两者会互相覆盖。
# - files 用白名单，只装"运行时真正需要的东西"：主进程编译产物 + 渲染产物 + package.json
#   （生产依赖由 electron-builder 自动从 node_modules 收集）。
# - productName 含中文，为了让安装包文件名保持 ASCII，显式写 artifactName。
# - npmRebuild: false —— 本项目是纯 JS 技术栈（无 .node 原生模块），不需要重建原生依赖；
#   开着反而会执行 npm，而本机 npm install 不可用，没必要冒这个风险。
#
# 【国内网络】electron-builder 要从 GitHub Releases 下载 Electron zip / winCodeSign / nsis。
# 直连 GitHub 常被墙（本机实测 github.com 返回 502）。用 `npm run build`（内部走
# scripts/dist.cjs）会自动套 npmmirror 镜像，无需手工设环境变量。
#
# 【已知坑：winCodeSign 解压失败】
# 症状：7za 报 "Cannot create symbolic link : 客户端没有所需的特权"，
#      路径形如 ...\winCodeSign\<hash>\darwin\10.12\lib\libcrypto.dylib。
# 原因：winCodeSign 包里含 macOS 符号链接，而 Windows 创建符号链接需要特权
#      （开发者模式 或 管理员）。electron-builder 需要它来给 exe 打图标/版本信息。
# 解法（任一）：
#   1) 开启「设置 → 隐私和安全性 → 开发者选项 → 开发人员模式」（推荐，一次设置永久生效）
#   2) 以管理员身份运行打包命令
#   3) 临时绕过（代价：exe 不带自定义图标/版本信息）：
#      node scripts/dist.cjs --win --dir -c.win.signAndEditExecutable=false

appId: cn.wmeng.ideasprout
productName: 风衍 IdeaSprout
copyright: Copyright © 2026 wmeng-dev

directories:
  output: release
  buildResources: build

files:
  - dist-electron/**/*
  - dist/renderer/**/*
  - package.json
  - "!**/*.map"

# 纯 JS，无原生模块 → 不需要 rebuild
npmRebuild: false
asar: true
# 应用图标（Windows 需要 >= 256x256）
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: IdeaSprout-${version}-win-${arch}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 风衍 IdeaSprout
  artifactName: IdeaSprout-${version}-win-${arch}-setup.${ext}

# ---------- macOS ----------
# ⚠️ 跨平台限制：**dmg / pkg 只能在 macOS 上构建**（electron-builder 需要 macOS 的
#    codesign / dmg 工具链）。Windows 机器上跑 --mac 会失败，属正常现象，不是配置问题。
#    要出 macOS 安装包，两条路：
#      ① 在 Mac 上：node scripts/dist.cjs --mac
#      ② 用 CI：见 .github/workflows/build.yml（macos-latest 跑 --mac，产物在 Actions 里下载）
# 未签名的包在 macOS 上会被 Gatekeeper 拦（"无法验证开发者"）→ 用户需右键 → 打开。
# 有 Apple 开发者证书时设 CSC_NAME / CSC_LINK 即可自动签名（本配置默认不签）。
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: build/icon.icns
  category: public.app-category.productivity
  darkModeSupport: true
  identity: null
  artifactName: IdeaSprout-${version}-mac-${arch}.${ext}

dmg:
  artifactName: IdeaSprout-${version}-mac-${arch}-installer.${ext}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
